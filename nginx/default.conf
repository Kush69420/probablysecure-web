server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Telemetry is regenerated every 20s; never let an edge or browser pin it.
    location = /api/status.json {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        default_type application/json;
        try_files $uri =503;
    }

    # Serve the original resume directly, rather than the SPA shell.
    location = /resume {
        alias /usr/share/nginx/html/resume.pdf;
        default_type application/pdf;
        add_header Content-Disposition 'inline; filename="Kush-Agrawal-Resume.pdf"';
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /resume/ {
        absolute_redirect off;
        return 308 /resume$is_args$args;
    }

    # Hashed bundle filenames, so these are safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
